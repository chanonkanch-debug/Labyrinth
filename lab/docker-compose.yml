# Labyrinth framework lab: ten real apps, each behind its own Labyrinth.
#
#   docker compose -f lab/docker-compose.yml up -d --build
#   python lab/matrix.py
#
# Ports (all bound to 127.0.0.1):  app direct 70NN  ·  through Labyrinth 71NN  ·  dashboard 72NN (token: lab)
# LABYRINTH_MODE=observe docker compose ... runs every proxy in observe-only mode.

x-labyrinth: &labyrinth
  build: ..
  image: labyrinth:dev
  restart: unless-stopped

x-labyrinth-env: &labyrinth-env
  LABYRINTH_ADMIN_TOKEN: lab
  LABYRINTH_ADMIN_HOST: 0.0.0.0
  LABYRINTH_TARPIT_MS: "100"
  LABYRINTH_COMPANY: labshop
  LABYRINTH_MODE: ${LABYRINTH_MODE:-divert}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}

services:
  express:
    build: apps/express
    ports: ["127.0.0.1:7001:8000"]

  labyrinth-express:
    <<: *labyrinth
    environment:
      <<: *labyrinth-env
      LABYRINTH_UPSTREAM: http://express:8000
    ports: ["127.0.0.1:7101:8080", "127.0.0.1:7201:8090"]
    depends_on: [express]

  nextjs:
    build: apps/nextjs
    ports: ["127.0.0.1:7002:8000"]

  labyrinth-nextjs:
    <<: *labyrinth
    environment:
      <<: *labyrinth-env
      LABYRINTH_UPSTREAM: http://nextjs:8000
    ports: ["127.0.0.1:7102:8080", "127.0.0.1:7202:8090"]
    depends_on: [nextjs]

  fastapi:
